<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Produto Prateleira</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1>Editar Produto Prateleira</h1>
        <div class="card card-body shadow-sm">
            <form method="POST">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome do Produto Prateleira</label>
                    <input type="text" name="nome" id="nome" class="form-control" value="{{ produto.nome }}" required>
                </div>
                <div class="mb-3">
                    <label for="preco" class="form-label">Preço (R$)</label>
                    <input type="number" step="0.01" name="preco" id="preco" class="form-control" value="{{ produto.preco }}" required>
                </div>
               <div class="col-md-4">
                    <label for="quantidade" class="form-label">Quantidade</label>
                    <input type="number" step="1" name="quantidade" id="quantidade" class="form-control" value="{{ produto.quantidade }}" required>
                </div>
                <button type="submit" class="btn btn-success">Salvar Alterações</button>
                <a href="/" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</body>
</html>
