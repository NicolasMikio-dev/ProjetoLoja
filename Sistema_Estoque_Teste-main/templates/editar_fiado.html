<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Devedor - Nico Prostfy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h4 class="mb-0">Editar Dívida de {{ fiado.cliente }}</h4>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label">Nome do Cliente</label>
                                <input type="text" name="cliente" class="form-control" value="{{ fiado.cliente }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Produto</label>
                                <input type="text" name="produto_nome" class="form-control" value="{{ fiado.produto_nome }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Valor Fiado (R$)</label>
                                <input type="number" step="0.01" name="valor_fiado" class="form-control" value="{{ fiado.valor_fiado }}" required>
                            </div>
                            <div class="d-flex justify-content-between">
                                <a href="/fiados" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-warning">Salvar Alterações</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
