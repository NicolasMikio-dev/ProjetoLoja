<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Sistema de Estoque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card shadow-sm" style="width: 100%; max-width: 400px;">
            <div class="card-body p-4">
                <h2 class="text-center mb-4 text-success">Criar Conta</h2>
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Escolha um Usuário</label>
                        <input type="text" name="username" id="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="senha" class="form-label">Escolha uma Senha</label>
                        <input type="password" name="senha" id="senha" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 mb-3">Finalizar Cadastro</button>
                    <div class="text-center">
                        <span>Já possui cadastro? <a href="/login">Faça login</a></span>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
